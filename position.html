<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JR東海 運行情報</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.header {
    height: 50px;
    background: #0066cc;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
}

.frame-container {
    width: 100vw;
    height: calc(100dvh - 50px);
    overflow: auto;
    -webkit-overflow-scrolling: touch;
}

.frame-container iframe {
    width: 115%;
    height: 115%;
    border: none;
}
</style>
</head>

<body>

<div class="header">
🚃 JR東海 運行情報
</div>

<div class="frame-container">
    <iframe
        src="https://traininfo.jr-central.co.jp/zairaisen/status_detail.html?line=10001&lang=ja">
    </iframe>
</div>
<script>
window.onload = function() {
    document.querySelector('.frame-container').scrollTop = 5600;
};
</script>
<div id="debug"
     style="
        position:fixed;
        top:55px;
        right:5px;
        background:white;
        padding:5px;
        border:1px solid #ccc;
        z-index:9999;">
0
</div>

<script>
const c = document.querySelector('.frame-container');

c.addEventListener('scroll', () => {
    document.getElementById('debug').textContent =
        Math.round(c.scrollTop);
});
</script>
</body>
</html>

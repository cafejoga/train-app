<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運行情報</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden; /* 全体の余計なスクロールを防ぐ */
}

.header {
    height: 50px;
    background: #00704A; /* ★スタバのブランドカラー（ディープグリーン）に変更 */
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    /* ★明朝体からモダンなゴシック体のフォント（iPhone/Android/PC対応）に変更 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
}

/* スクロールさせる外枠 */
.frame-container {
    width: 100vw;
    height: calc(100vh - 50px);
    overflow: auto; /* ここでスクロールさせる */
    -webkit-overflow-scrolling: touch;
}

/* iframe 自体を巨大にして、中身を強制的に全展開する */
.frame-container iframe {
    width: 100%;
    height: 13000px; /* JR東海のページがすっぽり収まるくらいの高さを指定 */
    border: none;
    pointer-events: none; /* iframe内のスクロールを無効化し、親のスクロールを優先 */
}

/* ★デバッグ用（#debug）のスタイルは不要になったため削除しました */
</style>
</head>
<body>

<div class="header">
🚃 JR東海 運行情報
</div>

<div class="frame-container">
    <iframe id="jrframe" src="https://traininfo.jr-central.co.jp/zairaisen/status_detail.html?line=10001&lang=ja"></iframe>
</div>

<script>
const container = document.querySelector('.frame-container');

/* ★デバッグへの文字書き込み処理（addEventListener 内の処理）を削除しました */

window.onload = function() {
    setTimeout(() => {
         container.scrollTop = 7845; 
    }, 1);
};
</script>

</body>
</html>

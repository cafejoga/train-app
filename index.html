    margin:0;
    color:white;

    -apple-system,

    linear-gradient(
      to bottom,
      #c8742a,

}

    text-align:center;

}

.trainCard{

    box-shadow:

}

.label{

    font-size:1.2rem;

    opacity:0.9;

    color:#ffe3c4;

    margin-bottom:12px;
}

.row{

    display:flex;

    justify-content:space-between;

}

.time{

    font-size:4.3rem;

    font-weight:700;

    line-height:1;
}

.type{

    font-size:1.2rem;

    padding:8px 14px;

    border-radius:16px;

    font-weight:bold;
}

/* 種別 */

.普通{
    background:#ddd;
    color:black;
}

.快速{
    background:#2f80ff;
}

.新快速{
    background:#ff8a00;
}

.区間快速{
    background:#37d34a;
    color:black;
}

.特別快速{
    background:#ffe100;
    color:black;
}

.remaining{

    margin-top:14px;

    color:#fff2e8;

    font-size:2rem;
}

#distanceBox{

    text-align:center;

    font-size:2.4rem;

    font-weight:bold;

    margin-top:22px;
}

#moveTime{

    text-align:center;

    font-size:2rem;

    margin-top:10px;

    color:#fff7d6;
}

#judgeBox{

    margin-top:20px;

    text-align:center;

    font-size:2.6rem;

    font-weight:bold;

    padding:18px;

    border-radius:20px;

    transition:0.3s;

    cursor:pointer;
}

#tapInfo{

    text-align:center;

    margin-top:10px;

    color:#ffe3c4;

    opacity:0.8;
}

/* ======================
   モード
====================== */

let mode;

const now = new Date();

const hour = now.getHours();

if(hour < 13){

    mode = "morning";
}
else{

    mode = "home";
}

let station;
let trains;

/* ======================
   モード設定
====================== */

function setupMode(){

    if(mode === "morning"){

        station = ogakiStation;

        trains = ogakiTrains;

        document
        .getElementById(
          "modeBox"
        ).innerText =

        "☀️ 朝モード";
    }

    else{

        station = nishiStation;

        trains = nishiGifuTrains;

        document
        .getElementById(
          "modeBox"
        ).innerText =

        "🌙 帰宅モード";
    }

    updateTrains();
}

/* ======================
   タップ切替
====================== */

document
.getElementById(
 "judgeBox"
).onclick = () => {

    if(mode === "morning"){

        mode = "home";
    }

    else{

        mode = "morning";
    }

    setupMode();
};

/* ======================
   電車
====================== */

let upcoming = [];

function updateTrains(){

 const now = new Date();

 upcoming = [];

 for(let train of trains){

   const [h,m] =
   train.time.split(":");

   const trainDate =
   new Date();

   trainDate.setHours(h);
   trainDate.setMinutes(m);
   trainDate.setSeconds(0);

   const diffSec =
   Math.floor(
    (trainDate-now)/1000
   );

   if(diffSec > 0){

      upcoming.push({

         ...train,

         diffSec

      });
   }

 }

 upcoming.sort(
   (a,b)=>
   a.diffSec-b.diffSec
 );

 if(upcoming.length < 2){

    return;
 }

 const next = upcoming[0];

 const second = upcoming[1];

 /* 次 */

 document
 .getElementById(
  "nextTime"
 ).innerText =
 next.time;

 const nextType =
 document.getElementById(
  "nextType"
 );

 nextType.innerText =
 next.type;

 nextType.className =
 "type " + next.type;

 document
 .getElementById(
  "nextRemain"
 ).innerText =

 `あと ${
   Math.floor(next.diffSec/60)
 }分 ${
   next.diffSec%60
 }秒`;

 /* その次 */

 document
 .getElementById(
  "secondTime"
 ).innerText =
 second.time;

 const secondType =
 document.getElementById(
  "secondType"
 );

 secondType.innerText =
 second.type;

 secondType.className =
 "type " + second.type;

 document
 .getElementById(
  "secondRemain"
 ).innerText =

 `あと ${
   Math.floor(second.diffSec/60)
 }分 ${
   second.diffSec%60
 }秒`;
}

/* ======================
   GPS
====================== */

navigator.geolocation
.watchPosition(

 position => {

   const lat =
   position.coords.latitude;

   const lng =
   position.coords.longitude;

   const dist =
   calcDistance(
    lat,
    lng,
    station.lat,
    station.lng
   );

   const realDist =
   Math.round(dist * 1.3);

   document
   .getElementById(
    "distanceBox"
   ).innerText =

   `${station.name}まで ${realDist}m`;

   /* 徒歩 or 自転車 */

   let speed;
   let icon;

   if(realDist <= 300){

      speed = 85;
      icon = "🚶";
   }

   else{

      speed = 220;
      icon = "🚲";
   }

   const moveSec =
   Math.floor(
     realDist / speed * 60
   );

   document
   .getElementById(
     "moveTime"
   ).innerText =

   `${icon} 約${
     Math.floor(moveSec/60)
   }分${
     moveSec%60
   }秒`;

   /* 判定 */

   if(upcoming.length === 0){

      return;
   }

   const margin =
   upcoming[0].diffSec
   -
   moveSec;

   const judge =
   document.getElementById(
    "judgeBox"
   );

   if(margin > 180){

      judge.innerText =
      "🟢 間に合う";

      judge.style.background =
      "#1f6f3c";
   }

   else if(margin > 0){

      judge.innerText =
      "🟡 ギリギリ";

      judge.style.background =
      "#9a7b00";
   }

   else{

      judge.innerText =
      "🔴 間に合わない";

      judge.style.background =
      "#8b1e1e";
   }

 },

 error => {

   alert(
    "GPSを許可してください"
   );

 },

 {
   enableHighAccuracy:true
 }

);

/* ======================
   距離
====================== */

function calcDistance(
 lat1,
 lon1,
 lat2,
 lon2
){

 const R = 6371000;

 const toRad =
 deg => deg * Math.PI/180;

 const dLat =
 toRad(lat2-lat1);

 const dLon =
 toRad(lon2-lon1);

 const a =

 Math.sin(dLat/2)
 *
 Math.sin(dLat/2)

 +

 Math.cos(toRad(lat1))
 *
 Math.cos(toRad(lat2))

 *
 Math.sin(dLon/2)
 *
 Math.sin(dLon/2);

 const c =
 2 *
 Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );

 return Math.round(R*c);
}

/* ======================
   起動
====================== */

updateTrains();

setInterval(
 updateTrains,

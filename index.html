<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<title>🚃トレインナビ ver1.10</title>

<style>

body{
    margin:0;
    color:white;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
    transition:0.4s;
}

/* 朝 */
.morningTheme{
    background:linear-gradient(to bottom,#c8742a,#6b3a12);
}

/* 夜 */
.homeTheme{
    background:linear-gradient(to bottom,#202040,#061326);
}

#top{
    min-height:100vh;
    padding:10px;
    box-sizing:border-box;
}

.trainCard{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(8px);
    border-radius:24px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
}

.label{
    font-size:1.2rem;
    opacity:0.9;
    color:#ffe3c4;
    margin-bottom:12px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.time{
    font-size:4.3rem;
    font-weight:700;
}

.type{
    font-size:1.2rem;
    padding:8px 14px;
    border-radius:16px;
    font-weight:bold;
    /* ★追加：リンク化した際のデフォルトの装飾（下線や紫化など）を完全に打ち消す */
    text-decoration: none; 
    color: white; 
    display: inline-block;
}

/* 種別カラー（修正版） */
.type_local{
    background:#ddd;
    color:black;
}

.type_rapid{
    background:#3d84ff;
    color:white; /* 明示的に指定 */
}

.type_shinkaisoku{
    background:#ff8a00;
    color:white; /* 明示的に指定 */
}

.type_kukan{
    background:#32d74b;
    color:black;
}

.type_special{
    background:#ffe100;
    color:black;
}

.remaining{
    margin-top:14px;
    font-size:2rem;
    color:#fff2e8;
}

#distanceBox{
    text-align:center;
    font-size:2.2rem;
    font-weight:bold;
    margin-top:22px;
}

#moveTime{
    text-align:center;
    font-size:2rem;
    margin-top:10px;
    color:#fff7d6;
}

#judgeBox{
    margin-top:20px;
    text-align:center;
    font-size:2.6rem;
    font-weight:bold;
    padding:18px;
    border-radius:20px;
    cursor:pointer;
}

</style>
</head>

<body>

<div id="top">
<div id="judgeBox">判定中...</div>
<br>
<div class="trainCard">
<div class="label">もっとも早い電車</div>
<div class="row">
<div class="time" id="nextTime">--</div>
<a href="position.html" class="type" id="nextType">--</a>
</div>
<div class="remaining" id="nextRemain">--</div>
</div>

<div class="trainCard">
<div class="label">その次</div>
<div class="row">
<div class="time" id="secondTime" style="color:#d6e7ff">--</div>
<a href="position.html" class="type" id="secondType">--</a>
</div>
<div class="remaining" id="secondRemain" style="color:#d6e7ff">--</div>
</div>

<div id="distanceBox">駅まで --m</div>
<div id="moveTime">--</div>


</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

/* 駅 */
const ogakiStation = {name:"大垣駅",lat:35.367149,lng:136.617332};
const nishiStation = {name:"西岐阜駅",lat:35.4046698,lng:136.7234266};
/* 種別マッピング */
const typeMap = {
  "普通":"type_local",
  "快速":"type_rapid",
  "新快速":"type_shinkaisoku",
  "区間快速":"type_kukan",
  "特別快速":"type_special"
};
const ogakiTrains = [ {time:"05:00",type:"普通"}, {time:"05:21",type:"普通"}, {time:"05:31",type:"普通"}, {time:"05:42",type:"普通"},
                     {time:"05:51",type:"区間快速"}, {time:"06:07",type:"新快速"}, {time:"06:13",type:"普通"}, {time:"06:24",type:"新快速"},
                     {time:"06:38",type:"新快速"}, {time:"06:44",type:"普通"}, {time:"06:53",type:"新快速"}, {time:"07:01",type:"新快速"}, 
                     {time:"07:06",type:"普通"}, {time:"07:11",type:"区間快速"}, {time:"07:16",type:"快速"}, {time:"07:22",type:"新快速"}, 
                     {time:"07:27",type:"普通"}, {time:"07:32",type:"区間快速"}, {time:"07:37",type:"快速"}, {time:"07:42",type:"新快速"},
                     {time:"07:47",type:"普通"}, {time:"07:52",type:"快速"}, {time:"08:01",type:"新快速"}, {time:"08:13",type:"快速"}, 
                     {time:"08:18",type:"特別快速"}, {time:"08:31",type:"快速"}, {time:"08:40",type:"新快速"}, {time:"08:56",type:"快速"},
                     {time:"09:11",type:"新快速"}, {time:"09:26",type:"快速"}, {time:"09:41",type:"新快速"}, 
                     {time:"09:56",type:"快速"}, {time:"10:11",type:"新快速"}, {time:"10:26",type:"快速"}, {time:"10:41",type:"新快速"},
                     {time:"10:56",type:"快速"}, {time:"11:11",type:"新快速"}, {time:"11:26",type:"快速"}, {time:"11:41",type:"新快速"},
                     {time:"11:56",type:"快速"}, {time:"12:11",type:"新快速"}, {time:"12:26",type:"快速"}, {time:"12:41",type:"新快速"},
                     {time:"12:56",type:"快速"}, {time:"13:11",type:"新快速"}, {time:"13:26",type:"快速"}, {time:"13:41",type:"新快速"},
                     {time:"13:56",type:"快速"}, {time:"14:11",type:"新快速"}, {time:"14:26",type:"快速"}, {time:"14:41",type:"新快速"},
                     {time:"14:56",type:"快速"}, {time:"15:11",type:"特別快速"}, {time:"15:26",type:"新快速"}, {time:"15:41",type:"特別快速"},
                     {time:"15:56",type:"新快速"}, {time:"16:10",type:"特別快速"}, {time:"16:26",type:"新快速"}, {time:"16:41",type:"新快速"},
                     {time:"16:56",type:"新快速"}, {time:"17:10",type:"特別快速"}, {time:"17:23",type:"新快速"}, {time:"17:34",type:"新快速"},
                     {time:"17:44",type:"特別快速"}, {time:"17:59",type:"新快速"}, {time:"18:12",type:"特別快速"}, {time:"18:23",type:"新快速"},
                     {time:"18:34",type:"新快速"}, {time:"18:44",type:"特別快速"}, {time:"18:53",type:"新快速"}, {time:"19:08",type:"新快速"},
                     {time:"19:23",type:"特別快速"}, {time:"19:38",type:"新快速"}, {time:"19:53",type:"特別快速"}, {time:"20:08",type:"新快速"},
                     {time:"20:23",type:"特別快速"}, {time:"20:38",type:"新快速"}, {time:"20:53",type:"特別快速"}, {time:"21:08",type:"新快速"}, 
                     {time:"21:23",type:"特別快速"}, {time:"21:38",type:"快速"}, {time:"21:53",type:"新快速"}, {time:"22:08",type:"快速"}, 
                     {time:"22:23",type:"新快速"}, {time:"22:48",type:"快速"}, {time:"22:58",type:"快速"}, {time:"23:17",type:"快速"},
                     {time:"23:36",type:"普通"} ];
const nishiGifuTrains = [
{time:"06:08",type:"普通"}, {time:"06:40",type:"快速"}, {time:"06:53",type:"普通"}, {time:"07:09",type:"新快速"},
{time:"07:23",type:"区間快速"}, {time:"07:37",type:"快速"}, {time:"07:49",type:"快速"}, {time:"07:56",type:"普通"},
{time:"08:17",type:"特別快速"}, {time:"08:26",type:"快速"}, {time:"08:36",type:"特別快速"}, {time:"08:45",type:"快速"},
{time:"08:57",type:"特別快速"}, {time:"09:09",type:"特別快速"}, {time:"09:30",type:"区間快速"}, {time:"09:42",type:"特別快速"},
{time:"09:55",type:"新快速"}, {time:"09:59",type:"快速"}, {time:"10:18",type:"特別快速"}, {time:"10:23",type:"新快速"},
{time:"10:37",type:"新快速"}, {time:"10:52",type:"快速"}, {time:"11:07",type:"新快速"}, {time:"11:22",type:"快速"},
{time:"11:37",type:"新快速"}, {time:"11:52",type:"快速"}, {time:"12:09",type:"新快速"}, {time:"12:22",type:"快速"},
{time:"12:38",type:"新快速"}, {time:"12:52",type:"快速"}, {time:"13:08",type:"新快速"}, {time:"13:23",type:"快速"},
{time:"13:38",type:"新快速"}, {time:"13:53",type:"快速"}, {time:"14:09",type:"新快速"}, {time:"14:22",type:"快速"},
{time:"14:38",type:"新快速"}, {time:"14:52",type:"快速"}, {time:"15:08",type:"新快速"}, {time:"15:23",type:"快速"},
{time:"15:38",type:"新快速"}, {time:"15:53",type:"快速"}, {time:"16:08",type:"新快速"}, {time:"16:23",type:"快速"},
{time:"16:38",type:"新快速"}, {time:"16:53",type:"快速"}, {time:"17:08",type:"新快速"}, {time:"17:23",type:"快速"},
{time:"17:38",type:"新快速"}, {time:"17:53",type:"快速"}, {time:"18:08",type:"新快速"}, {time:"18:24",type:"快速"},
{time:"18:35",type:"特別快速"}, {time:"18:49",type:"快速"}, {time:"18:55",type:"快速"}, {time:"19:05",type:"特別快速"},
{time:"19:19",type:"区間快速"}, {time:"19:26",type:"快速"}, {time:"19:36",type:"特別快速"}, {time:"19:49",type:"快速"},
{time:"19:55",type:"新快速"}, {time:"20:06",type:"特別快速"}, {time:"20:20",type:"快速"}, {time:"20:25",type:"新快速"},
{time:"20:38",type:"快速"}, {time:"20:53",type:"新快速"}, {time:"21:08",type:"特別快速"}, {time:"21:23",type:"快速"},
{time:"21:38",type:"特別快速"}, {time:"21:53",type:"快速"}, {time:"22:08",type:"特別快速"}, {time:"22:23",type:"区間快速"},
{time:"22:38",type:"新快速"}, {time:"22:53",type:"区間快速"}, {time:"23:13",type:"新快速"}, {time:"23:23",type:"区間快速"},
{time:"23:39",type:"新快速"}, {time:"23:57",type:"快速"}
];

/* モード */
let mode = (new Date().getHours() < 13) ? "morning" : "home";

let station, trains;

function setupMode(){
    if(mode === "morning"){
        station = ogakiStation;
        trains = ogakiTrains;
        document.body.className = "morningTheme";
    } else {
        station = nishiStation;
        trains = nishiGifuTrains;
        document.body.className = "homeTheme";
    }
    updateTrains();
}

/* 切替 */
document.getElementById("judgeBox").onclick = () => {
    mode = (mode === "morning") ? "home" : "morning";
    setupMode();
};

/* 電車 */
let upcoming = [];

function updateTrains(){

 const now = new Date();
 upcoming = [];

 for(let t of trains){

   const [h,m] = t.time.split(":");
   const d = new Date();
   d.setHours(h); d.setMinutes(m); d.setSeconds(0);

   const diffSec = Math.floor((d-now)/1000);

   if(diffSec > 0){
      upcoming.push({...t,diffSec});
   }
 }

 upcoming.sort((a,b)=>a.diffSec-b.diffSec);

 if(upcoming.length < 2) return;

 const next = upcoming[0];
 const second = upcoming[1];

document.getElementById("nextTime").innerText = next.time;
document.getElementById("nextType").innerText = next.type;
document.getElementById("nextType").className = "type " + typeMap[next.type];
document.getElementById("nextRemain").innerText =
`あと ${Math.floor(next.diffSec/60)}分 ${next.diffSec%60}秒`;

document.getElementById("secondTime").innerText = second.time;
document.getElementById("secondType").innerText = second.type;
document.getElementById("secondType").className = "type " + typeMap[second.type];
document.getElementById("secondRemain").innerText =
`あと ${Math.floor(second.diffSec/60)}分 ${second.diffSec%60}秒`;
}

/* GPS */
navigator.geolocation.watchPosition(pos => {

 const lat = pos.coords.latitude;
 const lng = pos.coords.longitude;

 const dist = calcDistance(lat,lng,station.lat,station.lng);
 const realDist = Math.round(dist * 1.3);

 document.getElementById("distanceBox").innerText =
 `${station.name}まで ${realDist}m`;

let speed;
let icon;

if(realDist >= 1000){
    speed = 220;
    icon = "🚲";
}
else{
    speed = 75;
    icon = "🚶";
}
 const moveSec = Math.floor(realDist / speed * 60);

 document.getElementById("moveTime").innerText =
 `${icon} 約${Math.floor(moveSec/60)}分${moveSec%60}秒`;

 if(upcoming.length === 0) return;

 const margin = upcoming[0].diffSec - moveSec;

 const judge = document.getElementById("judgeBox");

 /* 要件①（最優先） */
 if(
   station === nishiStation &&
   realDist >= 1000 &&
   upcoming[0].diffSec <= 720
 ){
    judge.innerText = "🐱 次の電車で";
    judge.style.background = "purple";
    return;
 }

 if(margin > 150){
    judge.innerText = "🟢 間に合う";
    judge.style.background = "#1f6f3c";
 }
 else if(margin > 0){
    judge.innerText = "🟡 ギリギリ";
    judge.style.background = "#9a7b00";
 }
 else{
    judge.innerText = "🔴 間に合わない";
    judge.style.background = "#8b1e1e";
 }

}, ()=>alert("GPS許可してください"), {enableHighAccuracy:true});

/* 距離 */
function calcDistance(lat1,lon1,lat2,lon2){
 const R=6371000;
 const toRad=d=>d*Math.PI/180;
 const dLat=toRad(lat2-lat1);
 const dLon=toRad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+
 Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
 return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

setupMode();
updateTrains();
setInterval(updateTrains,1000);

</script>

</body>
</html>

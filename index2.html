<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<title>🚃トレインナビ ver2.0</title>

<style>
body{
    margin:0;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    transition:0.4s;
}

.morningTheme{
    background:linear-gradient(to bottom,#c8742a,#6b3a12);
}

.homeTheme{
    background:linear-gradient(to bottom,#202040,#061326);
}

#top{
    min-height:100vh;
    padding:18px;
    box-sizing:border-box;
}

.trainCard{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(8px);
    border-radius:24px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
}

.label{font-size:1.2rem;opacity:0.9;color:#ffe3c4;margin-bottom:12px;}
.row{display:flex;justify-content:space-between;align-items:center;}
.time{font-size:4.3rem;font-weight:700;}
.type{font-size:1.2rem;padding:8px 14px;border-radius:16px;font-weight:bold;}

.type_local{background:#ddd;color:black;}
.type_rapid{background:#3d84ff;}
.type_shinkaisoku{background:#ff8a00;}
.type_kukan{background:#32d74b;color:black;}
.type_special{background:#ffe100;color:black;}

.remaining{margin-top:14px;font-size:2rem;color:#fff2e8;}

#distanceBox{text-align:center;font-size:2.4rem;font-weight:bold;margin-top:22px;}
#moveTime{text-align:center;font-size:2rem;margin-top:10px;color:#fff7d6;}

#judgeBox{
    margin-top:20px;
    text-align:center;
    font-size:2.6rem;
    font-weight:bold;
    padding:18px;
    border-radius:20px;
    cursor:pointer;
}
</style>
</head>

<body>
<div id="top">

<div class="trainCard">
<div class="label">次の電車</div>
<div class="row">
<div class="time" id="nextTime">--</div>
<div class="type" id="nextType">--</div>
</div>
<div class="remaining" id="nextRemain">--</div>
</div>

<div class="trainCard">
<div class="label">その次</div>
<div class="row">
<div class="time" id="secondTime">--</div>
<div class="type" id="secondType">--</div>
</div>
<div class="remaining" id="secondRemain">--</div>
</div>

<div id="distanceBox">駅まで --m</div>
<div id="moveTime">--</div>
<div id="judgeBox">駅モード切替</div>

</div>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

const ogakiStation = {name:"大垣駅",lat:35.367149,lng:136.617332};
const nagoyaStation = {name:"名古屋駅",lat:35.170694,lng:136.881637};

const typeMap = {
"普通":"type_local",
"快速":"type_rapid",
"新快速":"type_shinkaisoku",
"区間快速":"type_kukan",
"特別快速":"type_special"
};

const ogakiTrains = [


];

// 名古屋は後で追加
const nagoyaTrains = [
    
];

/* モード：駅切替のみ */
// 時刻で初期モード決定（午前=大垣 / 午後=名古屋）
let stationMode = (new Date().getHours() < 12) ? "ogaki" : "nagoya";
let station, trains;

function setupMode(){
    if(stationMode === "ogaki"){
        station = ogakiStation;
        trains = ogakiTrains;
        document.body.className = "morningTheme";
    } else {
        station = nagoyaStation;
        trains = nagoyaTrains;
        document.body.className = "homeTheme";
    }
    updateTrains();
}

/* 切替 */
document.getElementById("judgeBox").onclick = () => {
    stationMode = (stationMode === "ogaki") ? "nagoya" : "ogaki";
    setupMode();
};

let upcoming = [];

function updateTrains(){
 const now = new Date();
 upcoming = [];

 for(let t of trains){
   const [h,m] = t.time.split(":");
   const d = new Date();
   d.setHours(h); d.setMinutes(m); d.setSeconds(0);
   const diffSec = Math.floor((d-now)/1000);
   if(diffSec > 0) upcoming.push({...t,diffSec});
 }

 upcoming.sort((a,b)=>a.diffSec-b.diffSec);
 if(upcoming.length < 2) return;

 const next = upcoming[0];
 const second = upcoming[1];

 document.getElementById("nextTime").innerText = next.time;
 document.getElementById("nextType").innerText = next.type;
 document.getElementById("nextType").className = "type "+typeMap[next.type];
 document.getElementById("nextRemain").innerText =
 `あと ${Math.floor(next.diffSec/60)}分 ${next.diffSec%60}秒`;

 document.getElementById("secondTime").innerText = second.time;
 document.getElementById("secondType").innerText = second.type;
 document.getElementById("secondType").className = "type "+typeMap[second.type];
 document.getElementById("secondRemain").innerText =
 `あと ${Math.floor(second.diffSec/60)}分 ${second.diffSec%60}秒`;
}

/* GPS */
navigator.geolocation.watchPosition(pos=>{
 const lat=pos.coords.latitude;
 const lng=pos.coords.longitude;

 const dist=calc(lat,lng,station.lat,station.lng);
 const realDist=Math.round(dist*1.3);

 document.getElementById("distanceBox").innerText =
 `${station.name}まで ${realDist}m`;

 /* 徒歩のみ */
 const speed=75;
 const moveSec=Math.floor(realDist/speed*60);

 document.getElementById("moveTime").innerText=
 `🚶 約${Math.floor(moveSec/60)}分${moveSec%60}秒`;

 if(upcoming.length===0)return;
 const margin=upcoming[0].diffSec-moveSec;
 const judge=document.getElementById("judgeBox");

 if(margin>150){judge.innerText="🟢 間に合う";judge.style.background="#1f6f3c";}
 else if(margin>0){judge.innerText="🟡 ギリギリ";judge.style.background="#9a7b00";}
 else{judge.innerText="🔴 間に合わない";judge.style.background="#8b1e1e";}

},()=>alert("GPS許可してください"),{enableHighAccuracy:true});

function calc(lat1,lon1,lat2,lon2){
 const R=6371000;
 const r=d=>d*Math.PI/180;
 const dLat=r(lat2-lat1);
 const dLon=r(lon2-lon1);
 const a=Math.sin(dLat/2)**2+
 Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

setupMode();updateTrains();setInterval(updateTrains,1000);
</script>
</body>
</html>
